name: Release Please

# release-please owns the version number: it parses Conventional Commits on
# main, maintains CHANGELOG.md, and opens a "chore(main): release X.Y.Z" PR.
# Merging that PR tags the release and publishes it on GitHub.
on:
  push:
    branches: [ "main" ]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          release-type: go

  # Chained off the job above rather than `on: release: [published]`, because
  # a release created with the default GITHUB_TOKEN deliberately does not
  # trigger further workflow runs. Consuming the action's output keeps
  # publishing automatic without needing a PAT.
  publish:
    name: Build & publish release artifacts
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
